<!-- The site link card (public/og-card.png, 1200×630). Regenerate in Chromium at 1200×630 via Playwright. -->
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      background: #07090d;
      font-family: 'Inter', 'PingFang SC', 'Noto Sans CJK SC', 'WenQuanYi Zen Hei', sans-serif;
      color: #f1f4f9;
      overflow: hidden;
    }
    .wrap {
      position: relative;
      height: 100%;
      padding: 68px 84px;
      box-sizing: border-box;
      background:
        radial-gradient(760px 420px at 8% 100%, rgba(82, 201, 114, 0.14), transparent 65%),
        radial-gradient(840px 460px at 92% 8%, rgba(229, 174, 78, 0.18), transparent 62%),
        radial-gradient(640px 360px at 96% 85%, rgba(232, 100, 82, 0.12), transparent 65%),
        linear-gradient(180deg, #101520 0%, #07090d 100%);
      border: 1px solid rgba(226, 234, 245, 0.1);
    }
    .map-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand span {
      color: #e5ae4e;
      font-weight: 600;
    }
    .badge {
      padding: 8px 20px;
      border-radius: 999px;
      border: 1px solid rgba(229, 174, 78, 0.4);
      background: rgba(229, 174, 78, 0.1);
      color: #e5ae4e;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    h1 {
      position: relative;
      z-index: 1;
      font-size: 74px;
      line-height: 1.16;
      letter-spacing: -0.02em;
      margin: 58px 0 0;
      font-weight: 700;
    }
    h1 b {
      color: #e5ae4e;
    }
    .en {
      position: relative;
      z-index: 1;
      font-size: 30px;
      color: #a9b4c4;
      margin-top: 22px;
      font-weight: 400;
    }
    .foot {
      position: absolute;
      z-index: 1;
      left: 84px;
      right: 84px;
      bottom: 60px;
      display: flex;
      gap: 14px;
      font-size: 24px;
      color: #dce5f2;
    }
    .foot div {
      border: 1px solid rgba(226, 234, 245, 0.16);
      background: rgba(14, 18, 25, 0.85);
      border-radius: 999px;
      padding: 12px 26px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .foot i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e5ae4e;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <svg class="map-svg" viewBox="0 0 1200 630" fill="none">
      <path d="M840 0 V630 M980 0 V630 M1120 0 V630 M700 160 H1200 M700 320 H1200 M700 480 H1200" stroke="rgba(226,234,245,0.03)" stroke-width="1" />
      <path d="M680 -20 C 830 160 930 340 1160 650" stroke="rgba(229,174,78,0.12)" stroke-width="56" stroke-linecap="round" />
    </svg>
    <div class="top">
      <div class="brand">
        <svg width="44" height="44" viewBox="0 0 64 64" fill="none">
          <path d="M32 6L58 32L32 58L6 32Z" stroke="#e5ae4e" stroke-width="4" fill="#e5ae4e" fill-opacity="0.16" />
          <path d="M32 18L46 32L32 46L18 32Z" fill="#e5ae4e" />
        </svg>
        <em style="font-style:normal">dota2<span>.ai</span></em>
      </div>
      <div class="badge">Replay-Verified Coach</div>
    </div>
    <h1>拿<b>录像证据</b>说话的<br />Dota 2 赛后教练</h1>
    <div class="en">A Dota 2 post-match coach that watches your replay — and proves every line</div>
    <div class="foot">
      <div><i></i>贴比赛编号</div>
      <div><i></i>逐秒核对录像记录</div>
      <div><i></i>最该改的三件事与下局目标</div>
    </div>
  </div>
</body>
</html>
