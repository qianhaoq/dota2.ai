<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" fill="none">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0e16" />
      <stop offset="55%" stop-color="#07090d" />
      <stop offset="100%" stop-color="#0d121c" />
    </linearGradient>
    <radialGradient id="glowGold" cx="0.22" cy="0.15" r="0.65">
      <stop offset="0%" stop-color="#e5b55c" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#e5b55c" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRadiant" cx="0.06" cy="0.92" r="0.45">
      <stop offset="0%" stop-color="#3fb97a" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#3fb97a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowDire" cx="0.94" cy="0.12" r="0.48">
      <stop offset="0%" stop-color="#e0584c" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#e0584c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="aegis" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7cf7f" />
      <stop offset="100%" stop-color="#c98b2b" />
    </linearGradient>
    <linearGradient id="cardBg" x1="720" y1="42" x2="1144" y2="278" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111723" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#090d14" stop-opacity="0.96" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Frame & Ambient Field -->
  <rect x="1" y="1" width="1198" height="318" rx="22" fill="url(#canvas)" />
  <rect x="1" y="1" width="1198" height="318" rx="22" fill="url(#grid)" />
  <rect x="1" y="1" width="1198" height="318" rx="22" fill="url(#glowGold)" />
  <rect x="1" y="1" width="1198" height="318" rx="22" fill="url(#glowRadiant)" />
  <rect x="1" y="1" width="1198" height="318" rx="22" fill="url(#glowDire)" />

  <!-- Subtle Tactical Minimap Geometry -->
  <g opacity="0.32">
    <path d="M 650 318 C 760 220, 910 140, 1080 2" stroke="#68b5e8" stroke-opacity="0.22" stroke-width="24" stroke-linecap="round" />
    <path d="M 680 318 L 1050 2" stroke="#e5b55c" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="848" cy="172" r="22" stroke="#e5b55c" stroke-opacity="0.28" stroke-width="1.2" />
  </g>

  <!-- Outer Hairline Border -->
  <rect x="1" y="1" width="1198" height="318" rx="22" stroke="#e5b55c" stroke-opacity="0.26" stroke-width="1.5" />

  <!-- Left Editorial Column -->
  <g transform="translate(56, 52)">
    <!-- Faceted Emblem + Brand -->
    <g>
      <rect x="0" y="0" width="42" height="42" rx="11" fill="#101622" stroke="#e5b55c" stroke-opacity="0.45" stroke-width="1.4" />
      <path d="M9 32L9 17L24 32Z" fill="#3fb97a" fill-opacity="0.26" />
      <path d="M33 10L33 25L18 10Z" fill="#e0584c" fill-opacity="0.26" />
      <path d="M21 8L33 21L21 34L9 21Z" stroke="url(#aegis)" stroke-width="1.8" fill="#e5b55c" fill-opacity="0.12" />
      <path d="M21 14L27 21L21 28L15 21Z" fill="url(#aegis)" />

      <text x="56" y="28" fill="#f3f6fb" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" letter-spacing="-0.02em">
        dota2<tspan fill="#e5b55c">.ai</tspan>
      </text>

      <!-- Eyebrow Pill -->
      <rect x="172" y="8" width="292" height="26" rx="13" fill="#e5b55c" fill-opacity="0.1" stroke="#e5b55c" stroke-opacity="0.32" />
      <circle cx="188" cy="21" r="3.5" fill="#e5b55c" />
      <text x="200" y="25" fill="#e5b55c" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="600" letter-spacing="0.09em">
        REPLAY-VERIFIED COACH · 7.42
      </text>
    </g>

    <!-- Display Serif Headline -->
    <text x="0" y="106" fill="#f5f8fc" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="400" letter-spacing="-0.02em">
      Watches your <tspan fill="#e5b55c" font-style="italic">.dem</tspan> replay.
    </text>
    <text x="0" y="156" fill="#f5f8fc" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="400" letter-spacing="-0.02em">
      Proves every single word.
    </text>

    <!-- Crisp Subtitle -->
    <text x="0" y="198" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="400">
      28 replay lookup tools · Deterministic code fact-verifier · Web, DSH, MCP &amp; CLI
    </text>
  </g>

  <!-- Right Tactical Proof Card -->
  <g transform="translate(716, 40)">
    <rect x="0" y="0" width="428" height="240" rx="16" fill="url(#cardBg)" stroke="#232d3f" stroke-width="1.2" />
    <line x1="0" y1="44" x2="428" y2="44" stroke="#1c2534" stroke-width="1" />

    <!-- Card Header -->
    <circle cx="22" cy="22" r="4" fill="#3fb97a" />
    <text x="34" y="26" fill="#cbd5e1" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" letter-spacing="0.06em">
      MATCH #9100904020 · BEASTMASTER
    </text>
    <text x="342" y="26" fill="#3fb97a" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600">
