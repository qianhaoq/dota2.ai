    <g transform="translate(20, 62)">
      <rect x="0" y="0" width="54" height="24" rx="6" fill="#e5b55c" fill-opacity="0.14" stroke="#e5b55c" stroke-opacity="0.38" />
      <text x="27" y="16" text-anchor="middle" fill="#f2c46d" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="600">27:27</text>
      <text x="66" y="16" fill="#eef2f8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500">
        Primal Roar pierced BKB · stunned PA 3.4s
      </text>
      <text x="66" y="34" fill="#64748b" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="11">
        ref → cast:beastmaster:primal_roar:6
      </text>
    </g>

    <!-- Row 2: Trigger Rule -->
    <g transform="translate(20, 118)">
      <rect x="0" y="0" width="388" height="58" rx="10" fill="#e5b55c" fill-opacity="0.06" stroke="#e5b55c" stroke-opacity="0.3" />
      <rect x="0" y="0" width="3" height="58" rx="1.5" fill="#e5b55c" />
      <text x="14" y="22" fill="#e5b55c" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="700" letter-spacing="0.08em">WHEN → DO</text>
      <text x="92" y="22" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">PA shows or opens Black King Bar</text>
      <text x="14" y="43" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5">Hold Primal Roar exclusively for her BKB window.</text>
    </g>

    <!-- Row 3: Verifier Footer -->
    <g transform="translate(20, 198)">
      <rect x="0" y="0" width="186" height="24" rx="6" fill="#131b29" stroke="#222e42" />
      <text x="10" y="16" fill="#94a3b8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5">
        verifyReview: <tspan fill="#3fb97a" font-weight="600">0 dropped</tspan>
      </text>
      <rect x="196" y="0" width="192" height="24" rx="6" fill="#131b29" stroke="#222e42" />
      <text x="206" y="16" fill="#94a3b8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5">
        2D Map + Trace: <tspan fill="#f2c46d" font-weight="600">ready</tspan>
      </text>
    </g>
  </g>
</svg>
