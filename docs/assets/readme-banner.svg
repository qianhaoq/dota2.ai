<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">dota2.ai — a post-match Dota 2 coach that shows its evidence</title>
  <desc id="d">A stylised minimap: Radiant in the bottom-left, Dire in the top-right, three lanes with towers, the river between them and a team fight marked on it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f15"/>
      <stop offset="1" stop-color="#141a24"/>
    </linearGradient>
    <radialGradient id="radiant" cx="0" cy="1" r="1">
      <stop offset="0" stop-color="#2f9e5b" stop-opacity=".55"/>
      <stop offset=".7" stop-color="#2f9e5b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dire" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#c23c2a" stop-opacity=".6"/>
      <stop offset=".7" stop-color="#c23c2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f9e5b"/>
      <stop offset=".5" stop-color="#d6b46a"/>
      <stop offset="1" stop-color="#c23c2a"/>
    </linearGradient>
    <clipPath id="map"><rect width="300" height="300" rx="20"/></clipPath>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect y="354" width="1280" height="6" fill="url(#edge)"/>

  <!-- Wordmark -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="72" y="92" fill="#d6b46a" font-size="15" font-weight="700" letter-spacing="4">POST-MATCH COACH · PATCH 7.42</text>
    <path d="M98 124 L124 150 L98 176 L72 150 Z" fill="#c23c2a"/>
    <text x="140" y="178" fill="#f8fafc" font-size="84" font-weight="800" letter-spacing="-1">dota2.ai</text>
    <text x="72" y="226" fill="#cbd5e1" font-size="26" font-weight="500">A post-match Dota 2 coach that shows its evidence.</text>
    <text x="72" y="262" fill="#8b98ab" font-size="21">一位拿证据说话的 Dota 2 赛后教练</text>

    <g font-size="15" font-weight="600" fill="#e2e8f0">
      <rect x="72" y="290" width="86" height="32" rx="16" fill="#1d2633" stroke="#2f3b4d"/>
      <text x="115" y="311" text-anchor="middle">Laning</text>
      <rect x="168" y="290" width="86" height="32" rx="16" fill="#1d2633" stroke="#2f3b4d"/>
      <text x="211" y="311" text-anchor="middle">Deaths</text>
      <rect x="264" y="290" width="76" height="32" rx="16" fill="#1d2633" stroke="#2f3b4d"/>
      <text x="302" y="311" text-anchor="middle">Items</text>
      <rect x="350" y="290" width="80" height="32" rx="16" fill="#1d2633" stroke="#2f3b4d"/>
      <text x="390" y="311" text-anchor="middle">Fights</text>
      <rect x="440" y="290" width="108" height="32" rx="16" fill="#1d2633" stroke="#2f3b4d"/>
      <text x="494" y="311" text-anchor="middle">Pro cases</text>
      <rect x="558" y="290" width="150" height="32" rx="16" fill="#2a2416" stroke="#6b5a2e"/>
      <text x="633" y="311" text-anchor="middle" fill="#f1d58f">Next-game goal</text>
    </g>
  </g>

  <!-- Minimap -->
  <g transform="translate(908 30)">
    <g clip-path="url(#map)">
      <rect width="300" height="300" fill="#111820"/>
      <rect width="300" height="300" fill="url(#radiant)"/>
      <rect width="300" height="300" fill="url(#dire)"/>
      <!-- river: top-left to bottom-right -->
      <path d="M-10 20 C60 60 90 110 150 150 S240 240 310 280" fill="none" stroke="#3b82c4" stroke-opacity=".38" stroke-width="22" stroke-linecap="round"/>
      <!-- lanes -->
      <g fill="none" stroke="#cdb88f" stroke-opacity=".6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M40 252 V58 Q40 40 58 40 H248"/>
        <path d="M52 260 H242 Q260 260 260 242 V48"/>
        <path d="M58 242 L242 58"/>
      </g>
      <!-- Radiant towers -->
      <g fill="#4ade80" stroke="#0b0f15" stroke-width="2">
        <circle cx="40" cy="210" r="6"/><circle cx="40" cy="160" r="6"/><circle cx="40" cy="96" r="6"/>
        <circle cx="86" cy="214" r="6"/><circle cx="114" cy="186" r="6"/><circle cx="138" cy="162" r="6"/>
        <circle cx="90" cy="260" r="6"/><circle cx="150" cy="260" r="6"/><circle cx="208" cy="260" r="6"/>
      </g>
      <!-- Dire towers -->
      <g fill="#f87171" stroke="#0b0f15" stroke-width="2">
        <circle cx="92" cy="40" r="6"/><circle cx="150" cy="40" r="6"/><circle cx="210" cy="40" r="6"/>
        <circle cx="162" cy="138" r="6"/><circle cx="186" cy="114" r="6"/><circle cx="214" cy="86" r="6"/>
        <circle cx="260" cy="204" r="6"/><circle cx="260" cy="140" r="6"/><circle cx="260" cy="90" r="6"/>
      </g>
      <!-- Ancients -->
      <rect x="34" y="246" width="24" height="24" rx="5" transform="rotate(45 46 258)" fill="#22c55e" stroke="#bbf7d0" stroke-width="2"/>
      <rect x="242" y="30" width="24" height="24" rx="5" transform="rotate(45 254 42)" fill="#dc2626" stroke="#fecaca" stroke-width="2"/>
      <!-- A lost team fight on the river -->
      <circle cx="196" cy="184" r="22" fill="none" stroke="#d6b46a" stroke-opacity=".35" stroke-width="2"/>
      <circle cx="196" cy="184" r="13" fill="none" stroke="#d6b46a" stroke-opacity=".7" stroke-width="2"/>
      <circle cx="196" cy="184" r="5" fill="#f1d58f"/>
    </g>
    <rect width="300" height="300" rx="20" fill="none" stroke="#2f3b4d" stroke-width="2"/>
  </g>
</svg>
