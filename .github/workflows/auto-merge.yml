# Auto-merge when CI is green and Copilot code review has completed
# without CHANGES_REQUESTED. Human merge is optional.
#
# Gate: Build & Test (CI) + Copilot review submitted (APPROVED or COMMENT).
# Blocks: CI failed, Copilot CHANGES_REQUESTED, draft PR, labeled "no-auto-merge".
#
# Note: workflow_run only runs from the default branch once this file is merged.

name: Auto Merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request_review:
    types: [submitted]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  auto-merge:
    name: Squash merge when green
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'pull_request_review' &&
        github.event.review.state != 'changes_requested' &&
        contains(fromJSON('["copilot-pull-request-reviewer[bot]", "copilot-pull-request-reviewer"]'), github.event.review.user.login))
    steps:
      - name: Resolve PR and decide merge
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const COPILOT_LOGINS = new Set([
              'copilot-pull-request-reviewer[bot]',
              'copilot-pull-request-reviewer',
            ]);

            async function findPrNumber() {
              if (context.eventName === 'pull_request_review') {
                return context.payload.pull_request.number;
              }
              const run = context.payload.workflow_run;
              if (run.pull_requests && run.pull_requests.length > 0) {
                return run.pull_requests[0].number;
              }
              const { data: prs } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:${run.head_branch}`,
              });
              return prs[0]?.number ?? null;
            }

            const prNumber = await findPrNumber();
            if (!prNumber) {
              core.info('No open PR found — skip');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            if (pr.draft) {
              core.info(`PR #${prNumber} is draft — skip`);
              return;
            }
            if (pr.merged || pr.state !== 'open') {
              core.info(`PR #${prNumber} not open — skip`);
              return;
            }
            if (pr.base.ref !== 'main') {
              core.info(`PR #${prNumber} base is ${pr.base.ref}, not main — skip`);
              return;
            }
            if (pr.labels.some((l) => l.name === 'no-auto-merge')) {
              core.info(`PR #${prNumber} has no-auto-merge — skip`);
              return;
            }

            // CI: combined status + check runs for head SHA
            const sha = pr.head.sha;
            const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
              owner,
              repo,
              ref: sha,
            });

            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: sha,
              per_page: 100,
            });

            const relevantChecks = checkRuns.check_runs.filter((c) => {
              const name = (c.name || '').toLowerCase();
              // Ignore this workflow and optional custom LLM review
              if (name.includes('auto merge') || name.includes('squash merge')) return false;
              if (name.includes('custom llm')) return false;
              return true;
            });

            const failedChecks = relevantChecks.filter(
              (c) => c.status === 'completed' && !['success', 'neutral', 'skipped'].includes(c.conclusion)
            );
            const pendingChecks = relevantChecks.filter((c) => c.status !== 'completed');

            if (failedChecks.length > 0) {
              core.info(`Checks failed: ${failedChecks.map((c) => c.name).join(', ')} — skip`);
              return;
            }
            if (pendingChecks.length > 0) {
              core.info(`Checks pending: ${pendingChecks.map((c) => c.name).join(', ')} — skip`);
              return;
            }

            // Prefer check runs; if none, fall back to combined status (legacy)
            if (relevantChecks.length === 0 && combined.state !== 'success' && combined.total_count > 0) {
              core.info(`Combined status is ${combined.state} — skip`);
              return;
            }

            // Must have at least the CI job somehow — require Build & Test or any successful check
            const hasCi = relevantChecks.some(
              (c) =>
                c.conclusion === 'success' &&
                (/build\s*&\s*test/i.test(c.name) || /^ci$/i.test(c.name) || /build/i.test(c.name))
            );
            if (!hasCi && relevantChecks.length === 0) {
              core.info('No CI check runs found — skip');
              return;
            }
            if (!hasCi) {
              // If checks exist but none look like CI, still allow if all completed success
              const allSuccess = relevantChecks.every((c) =>
                ['success', 'neutral', 'skipped'].includes(c.conclusion)
              );
              if (!allSuccess) {
                core.info('CI-like check not found / not all green — skip');
                return;
              }
            }

            // Copilot review gate
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const copilotReviews = reviews.filter((r) => COPILOT_LOGINS.has(r.user?.login || ''));
            if (copilotReviews.length === 0) {
              core.info(`PR #${prNumber}: no Copilot review yet — skip (will retry when review lands)`);
              return;
            }

            // Latest Copilot review for this head commit if commit_id present
            const forHead = copilotReviews.filter((r) => !r.commit_id || r.commit_id === sha);
            const latest = (forHead.length ? forHead : copilotReviews).sort(
              (a, b) => new Date(b.submitted_at) - new Date(a.submitted_at)
            )[0];

            if (latest.state === 'CHANGES_REQUESTED') {
              core.info(`PR #${prNumber}: Copilot requested changes — skip`);
              return;
            }
            if (!['APPROVED', 'COMMENTED'].includes(latest.state)) {
              core.info(`PR #${prNumber}: Copilot review state ${latest.state} — skip`);
              return;
            }

            core.info(`Merging PR #${prNumber} (CI green + Copilot ${latest.state})`);
            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: prNumber,
              merge_method: 'squash',
              commit_title: `${pr.title} (#${prNumber})`,
              commit_message:
                'Auto-merged: CI green + Copilot code review completed without changes requested.',
            });
            core.info(`Squash-merged PR #${prNumber}`);
