# Auto-merge when CI is green, Copilot finished a non-blocking review on
# the head SHA, and every review thread is resolved.
#
# Copilot code review submits COMMENTED, not APPROVED (even with no
# findings). Requiring native APPROVED would disable auto-merge entirely.
# Gate instead: completed Copilot review on the head SHA + zero unresolved
# threads + reject COMMENTED bodies that are "Needs a closer look" /
# "Changes recommended" / "Changes required".
#
# Gate (all required):
#   - PR is open, not draft, base is main, no "no-auto-merge" label
#   - Build & Test (or CI) succeeded on the head SHA
#   - Relevant checks are completed and not failed (ignore Custom LLM Review
#     and this workflow's own check name). Codex Review Gate is NOT ignored.
#   - If check "copilot-pull-request-reviewer" exists on the head SHA, it
#     must have completed successfully
#   - Latest Copilot review for the head SHA is a non-blocking result:
#     APPROVED, or COMMENTED without closer-look / changes-recommended
#     (Copilot typically submits COMMENTED, not APPROVED)
#   - GraphQL reviewThreads: every thread isResolved (REST fallback:
#     fail closed if any review comments exist and resolution is unknown)
#
# Blocks: draft, non-main base, no-auto-merge, failed/pending relevant
# checks, Copilot CHANGES_REQUESTED / closer-look COMMENTED / missing
# head-SHA review, any unresolved review thread.
#
# Note: workflow_run only runs from the default branch once this file is merged.
# After resolving threads, re-run this workflow (workflow_dispatch) —
# thread resolution does not emit a workflow event.

name: Auto Merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to re-evaluate (e.g. after resolving review threads)'
        required: true
        type: string

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  auto-merge:
    name: Squash merge when green
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'pull_request_review' &&
        contains(fromJSON('["approved", "commented"]'), github.event.review.state) &&
        contains(fromJSON('["copilot-pull-request-reviewer[bot]", "copilot-pull-request-reviewer"]'), github.event.review.user.login))
    steps:
      - name: Resolve PR and decide merge
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const COPILOT_LOGINS = new Set([
              'copilot-pull-request-reviewer[bot]',
              'copilot-pull-request-reviewer',
            ]);
            const COPILOT_CHECK_RE = /copilot-pull-request-reviewer/i;
            const OK_CONCLUSIONS = new Set(['success', 'neutral', 'skipped']);

            function isIgnoredCheck(name) {
              const n = (name || '').toLowerCase();
              if (n.includes('auto merge') || n.includes('squash merge')) return true;
              if (n.includes('custom llm')) return true;
              return false;
            }

            function isCiCheck(name) {
              return /build\s*&\s*test/i.test(name) || /^ci$/i.test(name) || /build-and-test/i.test(name);
            }

            // Copilot submits COMMENTED, not APPROVED. Block closer-look /
            // changes-recommended titles so PR #33-style reviews still cannot merge.
            function copilotReviewAllowsMerge(review) {
              const state = review.state;
              if (state === 'CHANGES_REQUESTED') {
                return { ok: false, reason: 'CHANGES_REQUESTED' };
              }
              if (state === 'APPROVED') {
                return { ok: true, reason: 'APPROVED' };
              }
              if (state !== 'COMMENTED') {
                return { ok: false, reason: state };
              }
              const body = review.body || '';
              if (/needs a closer look|changes recommended|changes required/i.test(body)) {
                return {
                  ok: false,
                  reason: 'COMMENTED with closer-look / changes-recommended (not auto-mergeable)',
                };
              }
              return { ok: true, reason: 'COMMENTED without closer-look / changes-recommended' };
            }

            async function findPrNumber() {
              if (context.eventName === 'pull_request_review') {
                return context.payload.pull_request.number;
              }
              if (context.eventName === 'workflow_dispatch') {
                const raw = context.payload.inputs?.pr_number;
                const n = Number(raw);
                return Number.isInteger(n) && n > 0 ? n : null;
              }
              const run = context.payload.workflow_run;
              if (run.pull_requests && run.pull_requests.length > 0) {
                return run.pull_requests[0].number;
              }
              const { data: prs } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:${run.head_branch}`,
              });
              return prs[0]?.number ?? null;
            }

            async function countUnresolvedThreads(prNumber) {
              let unresolved = 0;
              let after = null;
              let hasNextPage = true;
              while (hasNextPage) {
                const result = await github.graphql(
                  `query($owner: String!, $name: String!, $number: Int!, $after: String) {
                    repository(owner: $owner, name: $name) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100, after: $after) {
                          nodes { isResolved }
                          pageInfo { hasNextPage endCursor }
                        }
                      }
                    }
                  }`,
                  { owner, name: repo, number: prNumber, after }
                );
                const conn = result.repository?.pullRequest?.reviewThreads;
                if (!conn) {
                  throw new Error('GraphQL returned no reviewThreads connection');
                }
                unresolved += conn.nodes.filter((t) => !t.isResolved).length;
                hasNextPage = conn.pageInfo.hasNextPage;
                after = conn.pageInfo.endCursor;
              }
              return unresolved;
            }

            async function countReviewComments(prNumber) {
              const comments = await github.paginate(github.rest.pulls.listReviewComments, {
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100,
              });
              return comments.length;
            }

            const prNumber = await findPrNumber();
            if (!prNumber) {
              core.info('No open PR found — skip');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            if (pr.draft) {
              core.info(`PR #${prNumber} is draft — skip`);
              return;
            }
            if (pr.merged || pr.state !== 'open') {
              core.info(`PR #${prNumber} not open — skip`);
              return;
            }
            if (pr.base.ref !== 'main') {
              core.info(`PR #${prNumber} base is ${pr.base.ref}, not main — skip`);
              return;
            }
            if (pr.labels.some((l) => l.name === 'no-auto-merge')) {
              core.info(`PR #${prNumber} has no-auto-merge — skip`);
              return;
            }

            const sha = pr.head.sha;

            const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
              owner,
              repo,
              ref: sha,
            });

            // listForRef returns { total_count, check_runs }. Iterate pages
            // explicitly so we never treat the wrapper object as an array.
            const checkRuns = [];
            for await (const response of github.paginate.iterator(github.rest.checks.listForRef, {
              owner,
              repo,
              ref: sha,
              per_page: 100,
            })) {
              checkRuns.push(...(response.data.check_runs || []));
            }

            const relevantChecks = checkRuns.filter((c) => !isIgnoredCheck(c.name));

            const failedChecks = relevantChecks.filter(
              (c) => c.status === 'completed' && !OK_CONCLUSIONS.has(c.conclusion)
            );
            const pendingChecks = relevantChecks.filter((c) => c.status !== 'completed');

            if (failedChecks.length > 0) {
              core.info(`Checks failed: ${failedChecks.map((c) => c.name).join(', ')} — skip`);
              return;
            }
            if (pendingChecks.length > 0) {
              core.info(`Checks pending: ${pendingChecks.map((c) => c.name).join(', ')} — skip`);
              return;
            }

            const hasCiCheck = relevantChecks.some(
              (c) => c.conclusion === 'success' && isCiCheck(c.name)
            );
            // Legacy commit statuses (no check runs): success combined status counts as CI.
            const hasLegacyCombinedCi =
              relevantChecks.length === 0 && combined.total_count > 0 && combined.state === 'success';

            if (relevantChecks.length === 0 && !hasLegacyCombinedCi) {
              core.info(
                combined.total_count > 0
                  ? `Combined status is ${combined.state} — skip`
                  : 'No CI check runs or combined statuses on head SHA — skip'
              );
              return;
            }
            if (relevantChecks.length > 0 && !hasCiCheck) {
              core.info('Build & Test (or CI) not successful on head SHA — skip');
              return;
            }

            const copilotChecks = checkRuns.filter((c) => COPILOT_CHECK_RE.test(c.name || ''));
            if (copilotChecks.length > 0) {
              const pendingCopilot = copilotChecks.filter((c) => c.status !== 'completed');
              const badCopilot = copilotChecks.filter(
                (c) => c.status === 'completed' && !OK_CONCLUSIONS.has(c.conclusion)
              );
              if (pendingCopilot.length > 0) {
                core.info(
                  `copilot-pull-request-reviewer pending: ${pendingCopilot.map((c) => c.status).join(', ')} — skip`
                );
                return;
              }
              if (badCopilot.length > 0) {
                core.info(
                  `copilot-pull-request-reviewer not successful: ${badCopilot.map((c) => c.conclusion).join(', ')} — skip`
                );
                return;
              }
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const copilotReviews = reviews.filter(
              (r) => COPILOT_LOGINS.has(r.user?.login || '') && r.state !== 'DISMISSED' && r.state !== 'PENDING'
            );
            if (copilotReviews.length === 0) {
              core.info(`PR #${prNumber}: no Copilot review yet — skip (will retry when review lands)`);
              return;
            }

            const withCommit = copilotReviews.filter((r) => r.commit_id);
            const forHead = withCommit.length
              ? withCommit.filter((r) => r.commit_id === sha)
              : copilotReviews;
            if (forHead.length === 0) {
              core.info(`PR #${prNumber}: no Copilot review for head ${sha.slice(0, 7)} — skip`);
              return;
            }

            const latest = forHead.sort(
              (a, b) => new Date(b.submitted_at) - new Date(a.submitted_at)
            )[0];

            const copilotGate = copilotReviewAllowsMerge(latest);
            if (!copilotGate.ok) {
              core.info(
                `PR #${prNumber}: latest Copilot review for head is ${latest.state} (${copilotGate.reason}) — skip`
              );
              return;
            }

            let unresolved;
            try {
              unresolved = await countUnresolvedThreads(prNumber);
            } catch (err) {
              core.warning(`GraphQL reviewThreads failed (${err.message}); REST fail-closed fallback`);
              const commentCount = await countReviewComments(prNumber);
              if (commentCount > 0) {
                core.info(
                  `PR #${prNumber}: cannot confirm thread resolution and ${commentCount} review comment(s) exist — skip`
                );
                return;
              }
              unresolved = 0;
            }

            if (unresolved > 0) {
              core.info(`PR #${prNumber}: ${unresolved} unresolved review thread(s) — skip`);
              return;
            }

            core.info(
              `Merging PR #${prNumber} (CI green + Copilot ${copilotGate.reason} + threads resolved)`
            );
            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: prNumber,
              merge_method: 'squash',
              commit_title: `${pr.title} (#${prNumber})`,
              commit_message:
                'Auto-merged: CI green + Copilot review on head SHA + all review threads resolved.',
            });
            core.info(`Squash-merged PR #${prNumber}`);
