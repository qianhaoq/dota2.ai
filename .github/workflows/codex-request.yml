# Asks Codex to review every new PR head, so nobody has to type
# "@codex review" by hand. The Codex Review Gate then turns green on its
# own once Codex reports no P0/P1 findings for that head.
#
# pull_request_target runs this file from main and never checks out PR
# code; it only posts one comment.
#
# Token: Codex only answers mentions from GitHub accounts linked to a Codex
# workspace. It replies "To use Codex here, create a Codex account" to
# github-actions[bot] (seen on #144). Set PIPELINE_TOKEN, a fine-grained PAT
# of the linked owner account (this repo only; Contents, Pull requests,
# Issues, Actions: read & write), and the request comes from that account.
# Without it this job still posts, but Codex will not review.

name: Codex Review Request

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: codex-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # The body must be exactly "@codex review": any extra text makes Codex
      # treat the mention as a cloud task ("Review Result … View task")
      # instead of a code review, and the Codex gate never sees a Review
      # Summary (seen on #142).
      - name: Comment "@codex review"
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN || github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "@codex review"
