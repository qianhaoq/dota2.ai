# Release the DSH plugin (packages/dsh) automatically on merges to `main` touching
# plugin-bundled paths, or manually from a `dsh-v<version>` tag:
# resolve version & bilingual release notes, test, pack one platform-independent
# archive, install and smoke-test it in a clean DSH web profile with DSH's own CLI,
# publish the archive and SHA256SUMS as a GitHub Release, and publish
# `@qianhaoq/dsh-dota2ai` to npm (with provenance + npmmirror sync).
#
# A manual run (workflow_dispatch) builds, smoke-tests, and uploads the archive
# as a workflow artifact by default (set `publish: true` to publish).

name: DSH plugin release

on:
  push:
    branches: [main]
    paths:
      - 'packages/dsh/**'
      - 'packages/review-engine/src/**'
      - 'packages/review-engine/data/**'
      - 'packages/cli/src/**'
      - 'lib/agent/**'
      - 'lib/coach/**'
      - 'lib/patch/**'
      - 'lib/data/**'
      - 'lib/matchReview/**'
      - 'lib/aiLanguage.js'
      - 'lib/analyticsEvents.js'
      - 'lib/rateLimiter.js'
      - 'src/**'
      - 'LICENSE'
      - '.github/workflows/dsh-release.yml'
      - '.github/scripts/dsh-release-meta.mjs'
    tags: ['dsh-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Release and npm (default: dry-run build & smoke test only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: dsh-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  DSH_VERSION: 0.2.2-rc.5   # current npm `latest` DSH release verified by the smoke gate
  PNPM_VERSION: 11.28.5     # DSH installs plugins with pnpm

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve release version & notes
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
        run: |
          # Refresh remote tags & main ref so workflow reruns always see newer releases before allocating a version.
          git fetch --tags --force origin
          if [ "${EVENT_NAME}" = "push" ] && [ "${REF_TYPE}" = "branch" ]; then
            git fetch origin "${GITHUB_REF_NAME}" || true
          fi

          would_publish="false"
          if [ "${EVENT_NAME}" = "push" ]; then
            would_publish="true"
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${DISPATCH_PUBLISH}" = "true" ]; then
            would_publish="true"
          fi

          meta_args=(version --pkg packages/dsh/package.json --out-github-output "$GITHUB_OUTPUT")
          if [ "${EVENT_NAME}" = "push" ] && [ "${REF_TYPE}" = "tag" ]; then
            test -s ".github/release-notes/${GITHUB_REF_NAME}.md" || { echo "missing or empty .github/release-notes/${GITHUB_REF_NAME}.md"; exit 1; }
            meta_args+=(--tag "${GITHUB_REF_NAME}")
          elif [ "${would_publish}" != "true" ]; then
            meta_args+=(--allow-registry-fallback)
          fi

          meta_json=$(node .github/scripts/dsh-release-meta.mjs "${meta_args[@]}")
          echo "Resolved release metadata: ${meta_json}"

          stale=$(node -e "console.log(String(Boolean(JSON.parse(process.argv[1]).stale)))" "${meta_json}")
          stale_reason=$(node -e "console.log(JSON.parse(process.argv[1]).staleReason ?? '')" "${meta_json}")
          resume_tag=$(node -e "console.log(JSON.parse(process.argv[1]).resumeTag ?? '')" "${meta_json}")
          version=$(node -e "console.log(JSON.parse(process.argv[1]).version)" "${meta_json}")
          prev_tag=$(node -e "console.log(JSON.parse(process.argv[1]).prevTag ?? '')" "${meta_json}")

          should_publish="${would_publish}"
          skip_build="false"
          if [ "${stale}" = "true" ]; then
            should_publish="false"
            if [ "${would_publish}" = "true" ]; then
              skip_build="true"
              echo "::notice::Skipping DSH plugin publish (${stale_reason}) for commit ${GITHUB_SHA} (latest tag: ${prev_tag})."
            else
              echo "::notice::HEAD is stale relative to ${prev_tag} (${stale_reason}); continuing dry-run build & smoke test."
            fi
          elif [ -n "${resume_tag}" ]; then
            echo "::notice::Resuming incomplete npm publish for ${resume_tag} at commit ${GITHUB_SHA}."
          fi
          echo "should_publish=${should_publish}" >> "$GITHUB_OUTPUT"
          echo "skip_build=${skip_build}" >> "$GITHUB_OUTPUT"

          if [ "${skip_build}" != "true" ]; then
            notes_args=(notes --version "${version}" --out "$RUNNER_TEMP/dsh-release-notes.md")
            if [ -n "${prev_tag}" ]; then
              notes_args+=(--prev-tag "${prev_tag}")
            fi
            node .github/scripts/dsh-release-meta.mjs "${notes_args[@]}"
          fi

      - name: Install dependencies
        if: steps.meta.outputs.skip_build != 'true'
        run: npm ci

      - name: Plugin tests
        if: steps.meta.outputs.skip_build != 'true'
        run: npx vitest run packages/dsh packages/mcp

      - name: Pack
        if: steps.meta.outputs.skip_build != 'true'
        run: node packages/dsh/scripts/pack.mjs --out dist-dsh --version "${{ steps.meta.outputs.version }}"

      - name: Install into a clean DSH profile & verify real web RPCs
        if: steps.meta.outputs.skip_build != 'true'
        run: |
          npm install --global "pnpm@${PNPM_VERSION}"
          mkdir -p "$RUNNER_TEMP/dsh" && cd "$RUNNER_TEMP/dsh"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "@deepseek-ai/dsh@${DSH_VERSION}"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { evaluatePluginCompatibility } from "@deepseek-ai/dsh-app-boot";
            const pkg = JSON.parse(readFileSync(process.env.GITHUB_WORKSPACE + "/packages/dsh/package.json", "utf8"));
            for (const v of ["0.2.1-rc.3", process.env.DSH_VERSION]) {
              const issue = evaluatePluginCompatibility(pkg, {}, v);
              if (issue) { console.error("Compatibility check failed for", v, issue); process.exit(1); }
            }
          '
          cd "$GITHUB_WORKSPACE"
          node packages/dsh/scripts/installed-smoke.mjs dist-dsh/*.tgz --dsh "$RUNNER_TEMP/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js"

      - name: Checksums
        if: steps.meta.outputs.skip_build != 'true'
        run: cd dist-dsh && sha256sum -c SHA256SUMS

      - name: Publish GitHub Release
        if: steps.meta.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist-dsh/*.tgz dist-dsh/SHA256SUMS --clobber
          else
            gh release create "${TAG}" dist-dsh/*.tgz dist-dsh/SHA256SUMS \
              --target "${GITHUB_SHA}" \
              --title "DSH plugin ${TAG#dsh-}" \
              --notes-file "$RUNNER_TEMP/dsh-release-notes.md"
          fi

      - name: Publish to npm
        if: steps.meta.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          ALREADY_PUBLISHED: ${{ steps.meta.outputs.already_published }}
        run: |
          if [ "${ALREADY_PUBLISHED}" = "true" ]; then
            echo "::notice::@qianhaoq/dsh-dota2ai@${VERSION} is already published on npm; skipping npm publish."
            exit 0
          fi
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$RUNNER_TEMP/npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          else
            echo "::notice::NPM_TOKEN secret is not set; attempting npm Trusted Publishing (OIDC)..."
          fi
          npm publish ./dist-dsh/*.tgz --access public --provenance
          # Guard against npm 11 first-publish 0.0.0-stage placeholder before downstream market probes run.
          for attempt in 1 2 3 4 5 6; do
            latest=$(curl -fsSL "https://registry.npmjs.org/@qianhaoq%2fdsh-dota2ai" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s)['dist-tags']?.latest??'')}catch{console.log('')}})" || true)
            if [ "${latest}" = "${VERSION}" ]; then
              echo "Verified registry dist-tags.latest=${latest}"
              break
            fi
            if [ "${attempt}" = "2" ] && echo "${latest}" | grep -q "stage"; then
              npm publish ./dist-dsh/*.tgz --access public --provenance || true
            fi
            sleep 5
          done
          curl -fsSL -X PUT "https://registry.npmmirror.com/@qianhaoq/dsh-dota2ai/sync" > /dev/null || true

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && steps.meta.outputs.should_publish != 'true' && steps.meta.outputs.skip_build != 'true'
        with:
          name: dsh-plugin
          path: dist-dsh/
