# PR7 e2e: Playwright visuals (390/1280), axe, keyboard/focus, screen digits.
# Runs on the same self-hosted linux/x64 pool as ci.yml. The Playwright
# webServer builds the app and serves it via the zero-outbound mock server.

name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ["self-hosted", "linux", "x64"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        # --with-deps apt-updates system packages; the self-hosted pool already
        # has the deps, so fall back to a plain browser install when the apt
        # mirror flakes (500 from deb.debian.org).
        run: npx playwright install --with-deps chromium || npx playwright install chromium

      - name: Run e2e (build + preview:mock + playwright)
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
